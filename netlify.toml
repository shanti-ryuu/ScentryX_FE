[build]
  # This command will be overridden by GitHub Actions
  command = "echo 'Build handled by GitHub Actions'"
  # This is where GitHub Actions will place the built files
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"