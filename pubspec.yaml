name: sentryx_mobile
description: IoT Gas Leak Detection System Mobile App
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.2

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_database: ^12.0.4
  firebase_messaging: ^16.0.4

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  url_launcher: ^6.2.2

  # Animations
  lottie: ^2.7.0

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

  # Image Picker
  image_picker: ^1.0.5

  # Permissions
  permission_handler: ^11.1.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # QR Code Scanner (for device registration)
  qr_code_scanner: ^1.0.1

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
